[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-isolated-training"
version = "0.1.0"
description = "Causally Isolated Training for Leakage-Free Recommendation — research code built on top of cornac (imported, not vendored)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cornac>=2.4.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "torch>=2.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# LightGCN backend (cornac imports dgl lazily).
lightgcn = ["dgl>=1.1"]
# The smoke checks run standalone via `python -m research.smoke.<name>` with no
# extra packages; pytest is only needed to run them as `pytest research/smoke`.
dev = ["pytest>=7"]

# `research` plus every subpackage under it (lib, runners, analysis, smoke,
# experiments). Modules are run as `python -m research.<...>`.
#
# Discovered rather than enumerated. This was `packages = ["research"]`, which
# setuptools reads literally: a built wheel carried only `research/*.py` and none
# of the subpackages, so `pip install .` produced an import-error on the first
# `from .lib import ...`. Nothing caught it because every documented workflow runs
# from the repo root, where the source tree shadows the installed package. A
# hand-written list would go stale the next time a subpackage is added -- as one
# was, when `experiments/` landed.
[tool.setuptools.packages.find]
include = ["research*"]
